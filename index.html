<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Digital Bahir Dar — Smart city tourism, navigation and AI travel guide for Bahir Dar, Ethiopia" />
    <meta name="application-name" content="Digital Bahir Dar" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bahir Dar" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="Digital Bahir Dar" />
    <meta property="og:description" content="Tourism, navigation and AI guide for Bahir Dar, Ethiopia" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Digital Bahir Dar 🇪🇹</title>
    <script>
      (function () {
        try {
          var theme = 'light'
          var raw = localStorage.getItem('dbd-theme')
          if (raw === 'dark' || raw === 'light') {
            theme = raw
          } else {
            var store = localStorage.getItem('digital-bahir-dar')
            if (store) {
              var parsed = JSON.parse(store)
              var t = parsed && parsed.state && parsed.state.theme
              if (t === 'dark') theme = 'dark'
            }
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          } else {
            document.documentElement.classList.remove('dark')
            document.documentElement.style.colorScheme = 'light'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
