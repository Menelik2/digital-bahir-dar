<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0ea5e9" />
  <title>Offline — Digital Bahir Dar</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #e2e8f0; text-align: center; padding: 1.5rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
    p { color: #94a3b8; margin: 0 0 1.25rem; max-width: 22rem; }
    button { background: #0ea5e9; color: #fff; border: 0; border-radius: 0.75rem; padding: 0.65rem 1.25rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>You’re offline</h1>
    <p>Digital Bahir Dar needs a connection for maps and live data. Cached pages may still work when you’re back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
